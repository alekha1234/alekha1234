<style>
  :root{--bg:#0B0F14;--surface:#111822;--border:#273244;--text:#F5F7FA;--muted:#94A3B8;--accent:#7C3AED;--cyan:#22D3EE}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none}
  .lbl{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(17,24,34,.85);border:1px solid var(--border);font:600 12px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.08em;color:var(--text);white-space:nowrap;backdrop-filter:blur(6px);transform:translateY(34px)}
  .lbl svg{width:16px;height:16px;flex:none}
  .lbl.center{font-size:13px;letter-spacing:.2em;background:transparent;border:0;transform:translateY(-38px);color:var(--muted)}
  header{position:fixed;top:0;left:0;right:0;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
  header a,header span{pointer-events:auto}
  .brand{font:700 13px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.2em;color:var(--muted)}
  .brand b{color:var(--text)}
  nav a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:18px}
  nav a:hover{color:var(--text)}
  #panel{position:fixed;right:24px;top:72px;width:340px;max-height:calc(100% - 96px);overflow:auto;background:rgba(17,24,34,.92);border:1px solid var(--border);border-radius:16px;padding:20px 22px;backdrop-filter:blur(10px);z-index:2;transition:opacity .25s,transform .25s}
  #panel.hidden{opacity:0;transform:translateX(12px);pointer-events:none}
  #panel .num{font:700 12px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.15em}
  #panel h2{margin:8px 0 10px;font:700 20px/1.2 "Space Grotesk",Inter,sans-serif;letter-spacing:.02em}
  #panel p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.55}
  #panel .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  #panel .tag{font:500 11.5px/1 "JetBrains Mono",Consolas,monospace;padding:6px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text)}
  #panel a.btn{display:inline-block;padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:600}
  #panel a.btn:hover{filter:brightness(1.12)}
  #hint{position:fixed;left:24px;bottom:22px;color:var(--muted);font:500 12px/1.5 "JetBrains Mono",Consolas,monospace;letter-spacing:.05em;z-index:2}
  #fallback{display:none;position:fixed;inset:0;overflow:auto;padding:60px 24px;background:var(--bg)}
  #fallback ul{max-width:640px;margin:0 auto;padding:0;list-style:none}
  #fallback li{padding:12px 0;border-bottom:1px solid var(--border)}
  @media (max-width:720px){
    #panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:46%;border-radius:14px}
    #panel.hidden{transform:translateY(12px)}
    #hint{display:none}
    nav{display:none}
  }
  @media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

<script>
const ICONS={
 doc:'<rect x="4" y="2" width="16" height="20" rx="2" fill="C"/><rect x="7" y="7" width="10" height="2" fill="#fff"/><rect x="7" y="11" width="10" height="2" fill="#fff"/><rect x="7" y="15" width="6" height="2" fill="#fff"/>',
 pipe:'<circle cx="4" cy="12" r="3.5" fill="C"/><circle cx="12" cy="5" r="3.5" fill="#fff"/><circle cx="12" cy="19" r="3.5" fill="#fff"/><circle cx="20" cy="12" r="3.5" fill="C"/><path d="M6 10L10 7M6 14L10 17M14 7L18 10M14 17L18 14" stroke="C" stroke-width="1.6" fill="none"/>',
 serve:'<rect x="3" y="3" width="18" height="5" rx="1.5" fill="C"/><rect x="3" y="10" width="18" height="5" rx="1.5" fill="#fff"/><rect x="3" y="17" width="18" height="5" rx="1.5" fill="C"/>',
 ops:'<circle cx="12" cy="12" r="6" fill="none" stroke="C" stroke-width="3.5"/><circle cx="12" cy="12" r="2" fill="#fff"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="C" stroke-width="2.4"/>',
 llm:'<path d="M3 4h18v11H10l-5 4v-4H3z" fill="C"/><circle cx="8" cy="9.5" r="1.4" fill="#fff"/><circle cx="12" cy="9.5" r="1.4" fill="#fff"/><circle cx="16" cy="9.5" r="1.4" fill="#fff"/>',
 cv:'<rect x="2" y="6" width="20" height="14" rx="3" fill="C"/><circle cx="12" cy="13" r="4.5" fill="#fff"/><circle cx="12" cy="13" r="2" fill="C"/>',
 eval:'<rect x="3" y="12" width="4" height="9" fill="#fff"/><rect x="10" y="6" width="4" height="15" fill="C"/><rect x="17" y="3" width="4" height="18" fill="#fff"/>',
 xai:'<circle cx="10" cy="10" r="7" fill="none" stroke="C" stroke-width="3"/><circle cx="10" cy="10" r="3" fill="#fff"/><path d="M15.5 15.5L21 21" stroke="C" stroke-width="3.5" stroke-linecap="round"/>'
};
const icon=(k,c)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k].replaceAll('"C"',`"${c}"`)}</svg>`;
const DATA=JSON.parse(document.getElementById('data').textContent);

// Fallback list (no WebGL / module failure)
function showFallback(){
  document.getElementById('fallback').style.display='block';
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('fb-list').innerHTML=DATA.areas.map(a=>`<li><b style="color:${a.color}">${a.num} ${a.name}</b><br><span style="color:var(--muted)">${a.desc}</span>${a.link?`<br><a style="color:var(--cyan)" href="${a.link}">repository</a>`:''}</li>`).join('');
}
window.addEventListener('error',e=>{ if(!window.__lab_ok) showFallback(); },true);
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
el.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
document.getElementById('labels').appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
camera.position.set(0,6.5,10);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.autoRotate=!reduced; controls.autoRotateSpeed=0.6;
controls.minDistance=6; controls.maxDistance=18; controls.maxPolarAngle=Math.PI*0.62;

scene.add(new THREE.AmbientLight(0xffffff,0.55));
const l1=new THREE.PointLight(0x7C3AED,60,40); l1.position.set(6,6,6); scene.add(l1);
const l2=new THREE.PointLight(0x22D3EE,50,40); l2.position.set(-6,-2,5); scene.add(l2);
const l3=new THREE.PointLight(0xF472B6,30,40); l3.position.set(0,7,-6); scene.add(l3);

// particle field
{
  const n=900, pos=new Float32Array(n*3);
  for(let i=0;i<n*3;i++) pos[i]=(Math.random()-0.5)*40;
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x94A3B8,size:0.05,transparent:true,opacity:0.6})));
}

// centre node
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(0.9,1),new THREE.MeshStandardMaterial({color:0x111822,emissive:0x7C3AED,emissiveIntensity:0.35,wireframe:true}));
scene.add(core);
{
  const d=document.createElement('div'); d.className='lbl center'; d.textContent='ALEKHA / AI ENGINEERING LAB';
  core.add(new CSS2DObject(d));
}

// area nodes on a tilted ring
const nodes=[], R=4.3;
DATA.areas.forEach((a,i)=>{
  const t=i/DATA.areas.length*Math.PI*2;
  const y=Math.sin(t*2)*0.9;
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.55,48,48),
    new THREE.MeshPhysicalMaterial({color:a.color,emissive:a.color,emissiveIntensity:0.25,roughness:0.25,metalness:0.15,clearcoat:0.8}));
  m.position.set(Math.cos(t)*R,y,Math.sin(t)*R);
  m.userData=a; scene.add(m); nodes.push(m);
  const d=document.createElement('div'); d.className='lbl'; d.innerHTML=icon(a.icon,a.color)+a.name;
  m.add(new CSS2DObject(d));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.72,0.02,8,64),new THREE.MeshBasicMaterial({color:a.color,transparent:true,opacity:0.5}));
  ring.rotation.x=Math.PI/2; m.add(ring);
});
// edges: centre→node + related pairs
const edgeMat=new THREE.LineBasicMaterial({color:0x334155,transparent:true,opacity:0.7});
const lines=[];
const addLine=(a,b,c)=>{const g=new THREE.BufferGeometry().setFromPoints([a,b]); const l=new THREE.Line(g,c||edgeMat); scene.add(l); lines.push(l);};
nodes.forEach(n=>addLine(new THREE.Vector3(0,0,0),n.position));
DATA.edges.forEach(([i,j])=>addLine(nodes[i].position,nodes[j].position,new THREE.LineBasicMaterial({color:nodes[i].userData.color,transparent:true,opacity:0.35})));

// interaction
const panel=document.getElementById('panel');
const show=a=>{
  document.getElementById('p-num').textContent=a.num; document.getElementById('p-num').style.color=a.color;
  document.getElementById('p-title').textContent=a.name;
  document.getElementById('p-desc').textContent=a.desc;
  document.getElementById('p-tags').innerHTML=a.tags.map(t=>`<span class="tag" style="border-color:${a.color}55">${t}</span>`).join('');
  const link=document.getElementById('p-link');
  if(a.link){link.href=a.link; link.style.display='inline-block'; link.style.background=a.color; link.style.color='#0B0F14';} else link.style.display='none';
  panel.classList.remove('hidden');
};
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(-9,-9), par=new THREE.Vector2();
let hovered=null;
const onMove=(x,y)=>{mouse.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); par.set(mouse.x,mouse.y);};
addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
addEventListener('pointerdown',e=>{onMove(e.clientX,e.clientY); ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(nodes)[0]; if(h) show(h.object.userData);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime();
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(nodes)[0]?.object||null;
  if(hit!==hovered){ hovered=hit; document.body.style.cursor=hit?'pointer':'default'; if(hit) show(hit.userData); }
  nodes.forEach((n,i)=>{
    const target=n===hovered?1.35:1; n.scale.lerp(new THREE.Vector3(target,target,target),0.12);
    if(!reduced) n.position.y+=Math.sin(t*0.8+i)*0.0015;
  });
  core.rotation.y=t*0.15; core.rotation.x=t*0.07;
  if(!reduced){ camera.position.x+=(par.x*0.6-camera.position.x*0.02)*0.01; }
  controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera);
  requestAnimationFrame(tick);
}
window.__lab_ok=true;
tick();
</script>
